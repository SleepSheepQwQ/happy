name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4

      - name: Vendor tailcat-kotlin into vendor/maven
        working-directory: packages/happy-android
        run: |
          chmod +x gradlew tools/tailcat/build.sh
          bash tools/tailcat/build.sh

      - name: Assemble debug + preview APKs
        working-directory: packages/happy-android
        run: ./gradlew --no-daemon --stacktrace assembleDebug assemblePreview

      - name: Collect APKs
        run: find packages/happy-android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: happy-android-apks
          path: packages/happy-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
