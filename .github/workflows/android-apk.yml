name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Toolchain info
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms || true

      - name: Vendor tailcat-kotlin into vendor/maven
        working-directory: packages/happy-android
        run: |
          chmod +x gradlew tools/tailcat/build.sh
          bash tools/tailcat/build.sh
          find vendor/maven -name '*.jar' -o -name '*.pom' | head

      - name: Assemble debug APK
        working-directory: packages/happy-android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APKs
        run: |
          ls -la packages/happy-android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: happy-android-debug-apk
          path: packages/happy-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
